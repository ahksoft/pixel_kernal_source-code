name: Build Kernel (Upstream KSU + SUSFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git curl cpio lz4 flex bison bc \
            libssl-dev libelf-dev binutils-aarch64-linux-gnu \
            clang lld llvm dwarves

      - name: Clone kernel source (engstk/gs r245)
        run: |
          git clone https://github.com/ahksoft/pixel_kernal_source-code.git kernel
          cd kernel
          git checkout main

      - name: Apply upstream KernelSU (tiann)
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v3.2.5
          echo "CONFIG_KSU=y" >> arch/arm64/configs/gki_defconfig

      - name: Apply SUSFS patches
        run: |
          cd kernel
          git clone --depth=1 -b gki-android14-6.1 \
            https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs

          # --- Main kernel SUSFS patch ---
          cp /tmp/susfs/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch .
          cp /tmp/susfs/kernel_patches/fs/susfs.c fs/
          cp /tmp/susfs/kernel_patches/include/linux/susfs.h include/linux/
          cp /tmp/susfs/kernel_patches/include/linux/susfs_def.h include/linux/

          patch -p1 < 50_add_susfs_in_gki-android14-6.1.patch || echo "[!] SUSFS kernel patch rejects (fs/proc/base.c is expected)"

          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/gki_defconfig

          # --- KSU SUSFS integration ---
          # This patch must be applied INSIDE the KSU repo root ($KERNEL_ROOT/KernelSU)
          cp /tmp/susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          cd KernelSU
          patch -p1 < 10_enable_susfs_for_ksu.patch || echo "[!] KSU SUSFS patch rejects -- check below"

      - name: Build kernel
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make O=out LLVM=1 gki_defconfig
          make O=out LLVM=1 -j$(nproc)

          grep -q "CONFIG_KSU=y" out/.config && echo "[+] KSU enabled"
          grep -q "CONFIG_KSU_SUSFS=y" out/.config && echo "[+] SUSFS enabled"

          lz4 -c -l -12 out/arch/arm64/boot/Image > out/Image.lz4
          ls -lh out/Image.lz4

      - name: Package as AnyKernel3 zip
        run: |
          curl -sL "https://github.com/engstk/gs/releases/download/r245/blu_spark_r245-gs-susfs_a05e531.zip" -o /tmp/ak3.zip
          mkdir ak3
          unzip -o /tmp/ak3.zip -d ak3/

          # Lower patch level requirement for older A15 builds
          sed -i 's/supported\.patchlevels=.*/supported.patchlevels=2025-04 -/' ak3/anykernel.sh

          rm -f ak3/Image.lz4
          cp kernel/out/Image.lz4 ak3/Image.lz4

          cd ak3
          zip -r ../blu_spark_r245-ksu-susfs.zip .
          cd ..
          ls -lh blu_spark_r245-ksu-susfs.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blu_spark_r245-ksu-susfs
          path: blu_spark_r245-ksu-susfs.zip
