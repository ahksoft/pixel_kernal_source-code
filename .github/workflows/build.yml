name: Build Kernel (KSU-Next + SUSFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git curl cpio lz4 flex bison bc \
            libssl-dev libelf-dev binutils-aarch64-linux-gnu \
            clang lld llvm dwarves

      - name: Clone kernel source (ahksoft/pixel_kernal_source-code)
        run: |
          git clone https://github.com/ahksoft/pixel_kernal_source-code.git kernel
          cd kernel
          git checkout main

      - name: Apply KernelSU-Next (legacy-susfs tag)
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s v3.1.0-legacy-susfs
          echo "CONFIG_KSU=y" >> arch/arm64/configs/gki_defconfig

      - name: Apply SUSFS kernel patches
        run: |
          cd kernel
          git clone --depth=1 -b gki-android14-6.1 \
            https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs

          cp /tmp/susfs/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch .
          cp /tmp/susfs/kernel_patches/fs/susfs.c fs/
          cp /tmp/susfs/kernel_patches/include/linux/susfs.h include/linux/
          cp /tmp/susfs/kernel_patches/include/linux/susfs_def.h include/linux/

          patch -p1 < 50_add_susfs_in_gki-android14-6.1.patch || echo "[!] SUSFS patch had rejects (fs/proc/base.c hunk is expected)"

          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/gki_defconfig

      - name: Build kernel
        run: |
          cd kernel
          mkdir -p out 
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make O=out LLVM=1 gki_defconfig
          make O=out LLVM=1 -j$(nproc)

          grep -q "CONFIG_KSU=y" out/.config && echo "[+] KSU enabled"
          grep -q "CONFIG_KSU_SUSFS=y" out/.config && echo "[+] SUSFS enabled"

          # Kernel lz4 uses legacy format (-l flag), no frame header
          lz4 -c -l -12 out/arch/arm64/boot/Image > out/Image.lz4
          ls -lh out/Image.lz4

      - name: Package as AnyKernel3 zip
        run: |
          curl -sL "https://github.com/engstk/gs/releases/download/r245/blu_spark_r245-gs-susfs_a05e531.zip" -o /tmp/ak3.zip
          mkdir ak3
          unzip -o /tmp/ak3.zip -d ak3/

          rm -f ak3/Image.lz4
          cp kernel/out/Image.lz4 ak3/Image.lz4

          cd ak3
          zip -r ../blu_spark_r245-ksunext-susfs-legacy.zip .
          cd ..
          ls -lh blu_spark_r245-ksunext-susfs-legacy.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blu_spark_r245-ksunext-susfs
          path: blu_spark_r245-ksunext-susfs-legacy.zip
